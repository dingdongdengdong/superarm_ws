# LeRobot config for moving only the Isaac Sim RoboParty V2.0 right arm.
# The AmazingHand stays fixed on this branch; no hand/grasp action is exposed.

_type: isaacsim_rpo_arm

joint_names:
  - right_arm_pitch_joint
  - right_arm_roll_joint
  - right_arm_yaw_joint
  - right_elbow_pitch_joint
  - right_elbow_yaw_joint

joint_state_topic: /follower/joint_states
joint_command_topic: /follower/joint_commands
phone_command_topic: /leader/joint_commands

# Safety contract for this branch: hand does not move.
fixed_hand: true
fixed_grasp: 0.0

connect_timeout_s: 10.0
mock: false
